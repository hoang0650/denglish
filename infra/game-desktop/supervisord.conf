[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
autorestart=true
priority=10
[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
autorestart=true
priority=20
[program:game]
command=/usr/bin/python3 -u /usr/local/bin/aim-game.py
user=player
environment=HOME="/home/player",USER="player"
autorestart=unexpected
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/player/game/server.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/home/player/game/error.log
stderr_logfile_maxbytes=10MB
