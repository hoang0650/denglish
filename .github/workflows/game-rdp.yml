name: Build isolated game RDP image
on:
  push:
    branches: [codex/game-rdp-20261029]
    paths: ['infra/game-desktop/**', '.github/workflows/game-rdp.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/game-desktop
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aimx-runpod-worker:game-rdp-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
